name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Crear proyecto Android
        run: |
          mkdir -p app/src/main/java/com/rr/ds4pad
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Ds4Pad"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.rr.ds4pad"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.rr.ds4pad"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature android:name="android.hardware.bluetooth" android:required="true" />

              <!-- Android 11 o menos -->
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <!-- Android 12+ -->
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />

              <application
                  android:allowBackup="false"
                  android:label="DS4 Pad"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/com/rr/ds4pad/MainActivity.kt <<'EOF_FILE'
          package com.rr.ds4pad

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.AlertDialog
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          @SuppressLint("MissingPermission")
          class MainActivity : Activity() {

              private lateinit var hid: Ds4Hid
              private lateinit var status: TextView
              private var started = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN
                          or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY)

                  status = TextView(this).apply { setTextColor(Color.LTGRAY); text = "Iniciando…"; textSize = 12f }
                  hid = Ds4Hid(this) { msg -> runOnUiThread { status.text = msg } }

                  val pair = Button(this).apply {
                      text = "EMPAREJAR"
                      setOnClickListener {
                          // Equivale a Share + PS: el celu queda descubrible y el ESP32 lo encuentra
                          startActivity(
                              Intent(BluetoothAdapter.ACTION_REQUEST_DISCOVERABLE)
                                  .putExtra(BluetoothAdapter.EXTRA_DISCOVERABLE_DURATION, 300)
                          )
                      }
                  }
                  val direct = Button(this).apply {
                      text = "CONECTAR A ESP"
                      setOnClickListener { pickBonded() }
                  }

                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(pair); addView(direct); addView(status)
                  }

                  val root = FrameLayout(this)
                  root.addView(PadView(this, hid))
                  root.addView(bar, FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT, Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL))
                  setContentView(root)

                  if (hasPerms()) startHid() else requestPermissions(perms(), 1)
              }

              private fun perms(): Array<String> =
                  if (Build.VERSION.SDK_INT >= 31) arrayOf(
                      Manifest.permission.BLUETOOTH_CONNECT,
                      Manifest.permission.BLUETOOTH_ADVERTISE,
                      Manifest.permission.BLUETOOTH_SCAN
                  ) else emptyArray()

              private fun hasPerms() = perms().all { checkSelfPermission(it) == PackageManager.PERMISSION_GRANTED }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  if (hasPerms()) startHid() else status.text = "Faltan permisos de Bluetooth"
              }

              private fun startHid() {
                  if (started) return
                  started = true
                  hid.start()
              }

              private fun pickBonded() {
                  val adapter = (getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager).adapter
                  val list = adapter.bondedDevices.toList()
                  if (list.isEmpty()) { status.text = "No hay dispositivos emparejados"; return }
                  AlertDialog.Builder(this)
                      .setTitle("Elegí el ESP32")
                      .setItems(list.map { "${it.name ?: "?"}  ${it.address}" }.toTypedArray()) { _, i -> hid.connect(list[i]) }
                      .show()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (started) hid.stop()
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/rr/ds4pad/Ds4Hid.kt <<'EOF_FILE'
          package com.rr.ds4pad

          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.content.Context
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          /**
           * Hace que el celular se anuncie como un gamepad Bluetooth Classic HID
           * ("Wireless Controller") con el mismo reporte de entrada 0x01 del DualShock 4.
           */
          @SuppressLint("MissingPermission")
          class Ds4Hid(private val ctx: Context, private val onState: (String) -> Unit) {

              companion object {
                  // Bits de `buttons` (mismo orden que los botones HID del DS4)
                  const val SQUARE = 1 shl 0
                  const val CROSS = 1 shl 1
                  const val CIRCLE = 1 shl 2
                  const val TRIANGLE = 1 shl 3
                  const val L1 = 1 shl 4
                  const val R1 = 1 shl 5
                  const val L2 = 1 shl 6
                  const val R2 = 1 shl 7
                  const val SHARE = 1 shl 8
                  const val OPTIONS = 1 shl 9
                  const val L3 = 1 shl 10
                  const val R3 = 1 shl 11
                  const val PS = 1 shl 12
                  const val TOUCHPAD = 1 shl 13

                  private val DESCRIPTOR = intArrayOf(
                      0x05, 0x01, 0x09, 0x05, 0xA1, 0x01,
                      0x85, 0x01,
                      // LX, LY, RX, RY
                      0x09, 0x30, 0x09, 0x31, 0x09, 0x32, 0x09, 0x35,
                      0x15, 0x00, 0x26, 0xFF, 0x00, 0x75, 0x08, 0x95, 0x04, 0x81, 0x02,
                      // Hat / D-pad
                      0x09, 0x39, 0x15, 0x00, 0x25, 0x07, 0x35, 0x00, 0x46, 0x3B, 0x01,
                      0x65, 0x14, 0x75, 0x04, 0x95, 0x01, 0x81, 0x42,
                      // 14 botones
                      0x65, 0x00, 0x05, 0x09, 0x19, 0x01, 0x29, 0x0E,
                      0x15, 0x00, 0x25, 0x01, 0x75, 0x01, 0x95, 0x0E, 0x81, 0x02,
                      // Contador de 6 bits
                      0x06, 0x00, 0xFF, 0x09, 0x20, 0x75, 0x06, 0x95, 0x01,
                      0x15, 0x00, 0x25, 0x7F, 0x81, 0x02,
                      // L2 / R2 analógicos
                      0x05, 0x01, 0x09, 0x33, 0x09, 0x34,
                      0x15, 0x00, 0x26, 0xFF, 0x00, 0x75, 0x08, 0x95, 0x02, 0x81, 0x02,
                      0xC0
                  ).map { it.toByte() }.toByteArray()
              }

              // Estado del mando (lo escribe la UI)
              @Volatile var lx = 128
              @Volatile var ly = 128
              @Volatile var rx = 128
              @Volatile var ry = 128
              @Volatile var l2 = 0
              @Volatile var r2 = 0
              @Volatile var hat = 8          // 0=N ... 7=NO, 8=suelto
              @Volatile var buttons = 0

              private val adapter: BluetoothAdapter =
                  (ctx.getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager).adapter
              private var hid: BluetoothHidDevice? = null
              private var host: BluetoothDevice? = null
              private var counter = 0
              private var oldName: String? = null
              private val exec = Executors.newSingleThreadExecutor()
              private val ticker = Executors.newSingleThreadScheduledExecutor()

              private val callback = object : BluetoothHidDevice.Callback() {
                  override fun onAppStatusChanged(pluggedDevice: BluetoothDevice?, registered: Boolean) {
                      onState(if (registered) "Listo. Tocá EMPAREJAR" else "No se pudo registrar el HID")
                  }

                  override fun onConnectionStateChanged(device: BluetoothDevice, state: Int) {
                      when (state) {
                          BluetoothProfile.STATE_CONNECTED -> {
                              host = device
                              onState("Conectado a ${device.name ?: device.address}")
                          }
                          BluetoothProfile.STATE_DISCONNECTED -> {
                              if (host?.address == device.address) host = null
                              onState("Desconectado")
                          }
                      }
                  }

                  override fun onGetReport(device: BluetoothDevice, type: Byte, id: Byte, bufferSize: Int) {
                      if (type == BluetoothHidDevice.REPORT_TYPE_INPUT && id.toInt() == 1) {
                          hid?.replyReport(device, type, id, buildReport())
                      } else {
                          hid?.reportError(device, BluetoothHidDevice.ERROR_RSP_UNSUPPORTED_REQUEST)
                      }
                  }

                  override fun onSetReport(device: BluetoothDevice, type: Byte, id: Byte, data: ByteArray) {
                      hid?.reportError(device, BluetoothHidDevice.ERROR_RSP_SUCCESS)
                  }
              }

              fun start() {
                  oldName = adapter.name
                  try { adapter.name = "Wireless Controller" } catch (_: Exception) {}

                  adapter.getProfileProxy(ctx, object : BluetoothProfile.ServiceListener {
                      override fun onServiceConnected(profile: Int, proxy: BluetoothProfile) {
                          val h = proxy as BluetoothHidDevice
                          hid = h
                          val sdp = BluetoothHidDeviceAppSdpSettings(
                              "Wireless Controller", "Game Controller", "Sony Interactive Entertainment",
                              BluetoothHidDevice.SUBCLASS2_GAMEPAD, DESCRIPTOR
                          )
                          h.registerApp(sdp, null, null, exec, callback)
                      }

                      override fun onServiceDisconnected(profile: Int) { hid = null }
                  }, BluetoothProfile.HID_DEVICE)

                  ticker.scheduleAtFixedRate({ tick() }, 0, 8, TimeUnit.MILLISECONDS)
              }

              /** Conecta directo a un ESP32 ya emparejado (alternativa al modo descubrible). */
              fun connect(device: BluetoothDevice) { hid?.connect(device) }

              fun stop() {
                  ticker.shutdownNow()
                  try {
                      hid?.unregisterApp()
                      adapter.closeProfileProxy(BluetoothProfile.HID_DEVICE, hid)
                  } catch (_: Exception) {}
                  oldName?.let { try { adapter.name = it } catch (_: Exception) {} }
              }

              private fun buildReport(): ByteArray {
                  val v = (hat and 0xF) or ((buttons and 0x3FFF) shl 4) or ((counter and 0x3F) shl 18)
                  return byteArrayOf(
                      lx.toByte(), ly.toByte(), rx.toByte(), ry.toByte(),
                      (v and 0xFF).toByte(), ((v shr 8) and 0xFF).toByte(), ((v shr 16) and 0xFF).toByte(),
                      l2.toByte(), r2.toByte()
                  )
              }

              private fun tick() {
                  val h = hid ?: return
                  val d = host ?: return
                  counter = (counter + 1) and 0x3F
                  h.sendReport(d, 1, buildReport())
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/rr/ds4pad/PadView.kt <<'EOF_FILE'
          package com.rr.ds4pad

          import android.content.Context
          import android.graphics.*
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.hypot
          import kotlin.math.min

          /** Mando en pantalla: 2 sticks, D-pad, 4 botones, L1/R1/L2/R2, Share, Options, PS, Touchpad, L3/R3. Multitouch. */
          class PadView(ctx: Context, private val hid: Ds4Hid) : View(ctx) {

              private class Btn(
                  val label: String, val bit: Int,
                  val cx: Float, val cy: Float, val hw: Float, val hh: Float, val round: Boolean
              )

              // bits internos extra para el D-pad
              private val UP = 1 shl 14
              private val DOWN = 1 shl 15
              private val LEFT = 1 shl 16
              private val RIGHT = 1 shl 17

              private var btns = listOf<Btn>()
              private var lc = PointF(); private var rc = PointF(); private var sr = 0f
              private var leftId = -1; private var rightId = -1
              private var lStick = PointF(); private var rStick = PointF()
              private var mask = 0

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val stroke = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 4f; color = 0xFF666666.toInt() }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; textAlign = Paint.Align.CENTER }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  val W = w.toFloat(); val H = h.toFloat()
                  val u = min(W, H)
                  sr = 0.2f * H
                  lc = PointF(0.32f * W, 0.72f * H)
                  rc = PointF(0.68f * W, 0.72f * H)
                  text.textSize = 0.05f * H
                  val s = 0.09f * H     // tamaño de cada tecla del D-pad y de los botones
                  val dp = PointF(0.13f * W, 0.42f * H)
                  val fc = PointF(0.87f * W, 0.42f * H)
                  btns = listOf(
                      Btn("↑", UP, dp.x, dp.y - s * 1.1f, s, s, false),
                      Btn("↓", DOWN, dp.x, dp.y + s * 1.1f, s, s, false),
                      Btn("←", LEFT, dp.x - s * 1.1f, dp.y, s, s, false),
                      Btn("→", RIGHT, dp.x + s * 1.1f, dp.y, s, s, false),
                      Btn("△", Ds4Hid.TRIANGLE, fc.x, fc.y - s * 1.1f, s, s, true),
                      Btn("✕", Ds4Hid.CROSS, fc.x, fc.y + s * 1.1f, s, s, true),
                      Btn("□", Ds4Hid.SQUARE, fc.x - s * 1.1f, fc.y, s, s, true),
                      Btn("○", Ds4Hid.CIRCLE, fc.x + s * 1.1f, fc.y, s, s, true),
                      Btn("L2", Ds4Hid.L2, 0.09f * W, 0.10f * H, 0.07f * W, 0.07f * H, false),
                      Btn("L1", Ds4Hid.L1, 0.09f * W, 0.24f * H, 0.07f * W, 0.06f * H, false),
                      Btn("R2", Ds4Hid.R2, 0.91f * W, 0.10f * H, 0.07f * W, 0.07f * H, false),
                      Btn("R1", Ds4Hid.R1, 0.91f * W, 0.24f * H, 0.07f * W, 0.06f * H, false),
                      Btn("SHARE", Ds4Hid.SHARE, 0.30f * W, 0.20f * H, 0.05f * W, 0.05f * H, false),
                      Btn("OPT", Ds4Hid.OPTIONS, 0.70f * W, 0.20f * H, 0.05f * W, 0.05f * H, false),
                      Btn("TOUCHPAD", Ds4Hid.TOUCHPAD, 0.5f * W, 0.20f * H, 0.11f * W, 0.11f * H, false),
                      Btn("PS", Ds4Hid.PS, 0.5f * W, 0.45f * H, 0.045f * W, 0.06f * H, true),
                      Btn("L3", Ds4Hid.L3, 0.41f * W, 0.52f * H, 0.035f * W, 0.05f * H, true),
                      Btn("R3", Ds4Hid.R3, 0.59f * W, 0.52f * H, 0.035f * W, 0.05f * H, true),
                  )
              }

              override fun onDraw(c: Canvas) {
                  c.drawColor(0xFF15171C.toInt())
                  for (b in btns) {
                      fill.color = if (mask and b.bit != 0) 0xFF3D7BFF.toInt() else 0xFF2A2D35.toInt()
                      val r = RectF(b.cx - b.hw, b.cy - b.hh, b.cx + b.hw, b.cy + b.hh)
                      if (b.round) {
                          c.drawOval(r, fill); c.drawOval(r, stroke)
                      } else {
                          c.drawRoundRect(r, 18f, 18f, fill); c.drawRoundRect(r, 18f, 18f, stroke)
                      }
                      c.drawText(b.label, b.cx, b.cy + text.textSize / 3, text)
                  }
                  fun stick(ctr: PointF, off: PointF) {
                      fill.color = 0xFF1F2228.toInt(); c.drawCircle(ctr.x, ctr.y, sr, fill); c.drawCircle(ctr.x, ctr.y, sr, stroke)
                      fill.color = 0xFF555B66.toInt(); c.drawCircle(ctr.x + off.x * sr, ctr.y + off.y * sr, sr * 0.45f, fill)
                  }
                  stick(lc, lStick); stick(rc, rStick)
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  val action = e.actionMasked
                  // Capturar qué dedo maneja cada stick al apoyarlo
                  if (action == MotionEvent.ACTION_DOWN || action == MotionEvent.ACTION_POINTER_DOWN) {
                      val i = e.actionIndex
                      val x = e.getX(i); val y = e.getY(i); val id = e.getPointerId(i)
                      if (leftId == -1 && hypot(x - lc.x, y - lc.y) < sr * 1.4f) leftId = id
                      else if (rightId == -1 && hypot(x - rc.x, y - rc.y) < sr * 1.4f) rightId = id
                  }
                  val skip = when (action) {
                      MotionEvent.ACTION_POINTER_UP -> e.actionIndex
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> -2 // todos
                      else -> -1
                  }
                  if (action == MotionEvent.ACTION_POINTER_UP) {
                      val id = e.getPointerId(e.actionIndex)
                      if (id == leftId) leftId = -1
                      if (id == rightId) rightId = -1
                  }
                  if (skip == -2) { leftId = -1; rightId = -1 }

                  var m = 0
                  lStick = PointF(); rStick = PointF()
                  if (skip != -2) {
                      for (i in 0 until e.pointerCount) {
                          if (i == skip) continue
                          val x = e.getX(i); val y = e.getY(i); val id = e.getPointerId(i)
                          when (id) {
                              leftId -> lStick = vec(x, y, lc)
                              rightId -> rStick = vec(x, y, rc)
                              else -> for (b in btns) {
                                  if (x in b.cx - b.hw..b.cx + b.hw && y in b.cy - b.hh..b.cy + b.hh) m = m or b.bit
                              }
                          }
                      }
                  }
                  mask = m
                  push()
                  invalidate()
                  return true
              }

              private fun vec(x: Float, y: Float, c: PointF): PointF {
                  var dx = (x - c.x) / sr; var dy = (y - c.y) / sr
                  val len = hypot(dx, dy)
                  if (len > 1f) { dx /= len; dy /= len }
                  return PointF(dx, dy)
              }

              private fun axis(v: Float) = (128 + v * 127).toInt().coerceIn(0, 255)

              private fun push() {
                  hid.lx = axis(lStick.x); hid.ly = axis(lStick.y)
                  hid.rx = axis(rStick.x); hid.ry = axis(rStick.y)
                  hid.l2 = if (mask and Ds4Hid.L2 != 0) 255 else 0
                  hid.r2 = if (mask and Ds4Hid.R2 != 0) 255 else 0
                  hid.buttons = mask and 0x3FFF

                  val u = mask and UP != 0; val d = mask and DOWN != 0
                  val l = mask and LEFT != 0; val r = mask and RIGHT != 0
                  hid.hat = when {
                      u && r -> 1; u && l -> 7; d && r -> 3; d && l -> 5
                      u -> 0; r -> 2; d -> 4; l -> 6
                      else -> 8
                  }
              }
          }
          EOF_FILE
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DS4 Pad ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
